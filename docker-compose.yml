version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: qizzle-postgres
    restart: always
    environment:
      POSTGRES_USER: qizzle
      POSTGRES_PASSWORD: qizzle
      POSTGRES_DB: qizzle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U qizzle" ]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: qizzle-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
